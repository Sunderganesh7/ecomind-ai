name: EcoMind AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        # pip install -r backend/requirements.txt (To be uncommented when requirements exist)
    - name: Lint backend
      run: |
        # flake8 backend/ (To be uncommented when linting configured)
        echo "Linting placeholder"
    - name: Run backend tests
      run: |
        # pytest backend/ (To be uncommented when tests exist)
        echo "Backend tests placeholder"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci || npm install
    - name: Run frontend tests
      run: |
        cd frontend
